<header><div class="hd"><svg class="lg" viewBox="0 0 64 64"><use href="#lgo"/></svg><h1>Cálculo Integral<small>Pizarrón de estudio</small></h1></div><p>Teoría completa + ejemplos paso a paso (sustitución, partes, fracciones parciales, integral definida) + tarjetas de fórmulas.</p></header>
<svg width="0" height="0" style="position:absolute"><symbol id="lgo" viewBox="0 0 64 64"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b9be0"/><stop offset="1" stop-color="#1558a0"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#lgg)"/><g fill="#fff" opacity=".3"><rect x="31" y="40" width="6" height="14"/><rect x="37" y="33" width="6" height="21"/><rect x="43" y="28" width="6" height="26"/><rect x="49" y="31" width="6" height="23"/></g><path d="M28 54C34 30 44 22 58 28" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".9"/><path class="ig" pathLength="100" d="M25 9C19 7 17 12 18 22L21 42C22 52 18 57 12 53" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<div id="sp" onclick="this.style.display='none'"><svg viewBox="0 0 64 64"><use href="#lgo"/></svg><b>Cálculo Integral</b><small>Pizarrón de estudio</small></div>

<script>
const fm=s=>s.replace(/\^(\{([^}]*)\}|[−-]?\w)/g,(m,a,b)=>'<sup>'+(b??a)+'</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>');
const T=[
{n:"1 · Antiderivada",th:[
["Problema central","Cálculo diferencial: dada f, hallar f′. Cálculo integral: dada f, hallar una función F cuya derivada sea f. Es “diferenciar en reversa”."],
["Definición","F es una <b>antiderivada</b> de f en un intervalo I si F′(x) = f(x) para toda x en I. Ej.: para f(x)=2x, F(x)=x^2 (también x^2−1, x^2+10). Toda antiderivada es de la forma G(x)=F(x)+C."],
["Teorema: difieren por una constante","Si G′(x)=F′(x) en [a,b] entonces G(x)=F(x)+C. <b>Demostración:</b> sea g=G−F; g′=0. Por el teorema del valor medio, g(x₂)−g(x₁)=g′(k)(x₂−x₁)=0 para cualesquiera x₁,x₂; luego g es constante C y G=F+C."],
["Notación","∫f(x)dx = F(x)+C. ∫ = signo integral (Leibniz); f(x) = integrando; dx = variable de integración; C = constante de integración; el proceso se llama antidiferenciación o integración. <b>Inversas:</b> ∫F′(x)dx = F(x)+C y d/dx ∫f(x)dx = f(x)."],
["Propiedades","1) ∫k f(x)dx = k∫f(x)dx. 2) ∫[f(x) ± g(x)]dx = ∫f(x)dx ± ∫g(x)dx."]],
ex:[
{t:"∫(3x^2+2x−1)dx",s:[["Propiedad de la suma/resta: integra término a término","∫(3x^2+2x−1)dx = ∫3x^2dx + ∫2x dx − ∫1 dx"],["Propiedad 1: la constante sale de la integral","= 3∫x^2dx + 2∫x dx − ∫dx"],["Regla de la potencia: ∫x^n dx = x^{n+1}/(n+1)","= 3·x^3/3 + 2·x^2/2 − x + C"],["Simplifica","= x^3 + x^2 − x + C"],["Verifica derivando (operaciones inversas)","d/dx[x^3+x^2−x+C] = 3x^2+2x−1 ✓"]]},
{t:"∫(4x − 2/x + 5 sen x)dx",s:[["Separa en tres integrales y saca constantes","= 4∫x dx − 2∫(1/x)dx + 5∫sen x dx"],["∫x dx = x²/2 · ∫1/x dx = ln|x| · ∫sen x dx = −cos x","= 4·x^2/2 − 2 ln|x| + 5(−cos x) + C"],["Simplifica","= 2x^2 − 2 ln|x| − 5 cos x + C"]]}]},
{n:"2 · Sustitución",th:[
["Regla de la sustitución u","Si u=g(x) es diferenciable, f continua y F′=f: ∫f(g(x))g′(x)dx = ∫f(u)du. <b>Prueba:</b> por regla de la cadena d/dx F(g(x))=F′(g(x))g′(x), luego ∫F′(g(x))g′(x)dx=F(g(x))+C=F(u)+C=∫f(u)du."],
["Directrices","1) Identifica g(x) y g′(x)dx (completa con un 1 apropiado si hace falta). 2) Expresa todo en u y du. 3) Integra respecto a u. 4) Regresa a x cambiando u por g(x)."],
["Potencia de una función","∫[g(x)]^n g′(x)dx = [g(x)]^{n+1}/(n+1) + C (con u=g(x), du=g′(x)dx)."],
["Completar el cuadrado","Si el integrando tiene ax²+bx+c, completa el cuadrado para obtener funciones trigonométricas inversas: ∫1/√(a²−u²)du = arcsen(u/a)+C · ∫1/(a²+u²)du = (1/a)arctan(u/a)+C · ∫1/(u√(u²−a²))du = (1/a)arcsec|u/a|+C. Ejercicio de la clase: deduce ∫tan, ∫cot, ∫sec, ∫csc."]],
ex:[
{t:"∫(2x−5)^{11}dx",s:[["Identifica g(x): lo de adentro","u = 2x − 5"],["Diferencial: du = g′(x)dx","du = 2dx ⇒ dx = du/2"],["Sustituye todo en términos de u","∫u^{11}(du/2) = ½∫u^{11}du"],["Regla de la potencia","= ½·u^{12}/12 + C = u^{12}/24 + C"],["Regresa a x","= (2x−5)^{12}/24 + C"]]},
{t:"∫cos^4x sen x dx",s:[["u = g(x) = cos x","u = cos x"],["du = −sen x dx; despeja sen x dx","sen x dx = −du"],["Sustituye","∫cos^4x sen x dx = −∫u^4du"],["Regla de la potencia","= −u^5/5 + C"],["Regresa a x","= −cos^5x/5 + C"]]},
{t:"∫tan x dx",s:[["Identidad: tan x = sen x / cos x","∫tan x dx = ∫(sen x/cos x)dx"],["u = cos x, du = −sen x dx","sen x dx = −du"],["Sustituye","= −∫du/u"],["∫1/u du = ln|u|","= −ln|u| + C"],["Regresa a x; −ln|cos x| = ln|sec x|","= −ln|cos x| + C = ln|sec x| + C"]]},
{t:"∫(x+4)/(x^2+6x+18) dx",s:[["Completa el cuadrado: suma y resta 9","x^2+6x+18 = (x+3)^2 + 9"],["u = x+3 ⇒ x = u−3, dx = du","x+4 = u+1"],["Sustituye y separa en dos integrales","= ∫u/(u^2+9)du + ∫1/(u^2+9)du"],["1ª: w=u²+9 da ½ln|w|. 2ª: ∫1/(a²+u²)du=(1/a)arctan(u/a), a=3","= ½ ln(u^2+9) + ⅓ arctan(u/3) + C"],["Regresa a x","= ½ ln(x^2+6x+18) + ⅓ arctan((x+3)/3) + C"]]}]},
{n:"3 · Partes",th:[
["Fórmula","∫f(x)g′(x)dx = f(x)g(x) − ∫g(x)f′(x)dx, o bien <b>∫u dv = uv − ∫v du</b> (u=f(x), dv=g′(x)dx)."],
["Directrices","1) Elige dv: suele ser el factor más complicado que se integra con una fórmula básica, e intégralo para hallar v. 2) Deriva el factor restante u para hallar du. 3) Forma uv − ∫v du e integra. Tip: u suele ser ln, arco-trig o polinomio (baja de grado al derivar)."],
["Ejemplos de la clase","∫ln x dx = x ln x − x + C · ∫x³ln x dx = ¼x⁴ln x − (1/16)x⁴ + C · ∫x arctan x dx = ½x²arctan x − ½x + ½arctan x + C · ∫sec³x dx = ½sec x tan x + ½ln|sec x+tan x| + C. Pendiente de práctica: ∫x⁴e^{−2x}dx (partes 4 veces)."]],
ex:[
{t:"∫ln x dx",s:[["Fórmula: ∫u dv = uv − ∫v du","∫ln x dx"],["Elige u (lo que derivas) y dv (lo que integras)","u = ln x ; dv = dx"],["Deriva u e integra dv","du = dx/x ; v = x"],["Aplica la fórmula","= x ln x − ∫x·(1/x)dx"],["Simplifica e integra","= x ln x − x + C"]]},
{t:"∫x^2 cos x dx",s:[["u = x² (baja de grado), dv = cos x dx","du = 2x dx ; v = sen x"],["1ª vez por partes","∫x^2cos x dx = x^2 sen x − ∫2x sen x dx"],["2ª vez: u=2x, dv=sen x dx ⇒ du=2dx, v=−cos x","∫2x sen x dx = −2x cos x + ∫2cos x dx = −2x cos x + 2 sen x"],["Sustituye y cuida el signo menos","= x^2 sen x − (−2x cos x + 2 sen x) + C"],["Resultado","= x^2 sen x + 2x cos x − 2 sen x + C"]]}]},
{n:"4 · Fracciones parciales",th:[
["Idea y supuestos","Separar r(x)=p(x)/q(x) en fracciones simples. Se supone fracción propia (grado p < grado q) y sin factores comunes. Ej.: 2/(x+5)+1/(x+1) = (3x+7)/((x+1)(x+5))."],
["Lineales distintos","q contiene (a₁x+b₁)(a₂x+b₂)…(aₙx+bₙ) ⇒ f = C₁/(a₁x+b₁) + C₂/(a₂x+b₂) + … + Cₙ/(aₙx+bₙ)."],
["Lineales repetidos","Factor (ax+b)^n ⇒ C₁/(ax+b) + C₂/(ax+b)² + … + Cₙ/(ax+b)^n."],
["Cuadráticos distintos","Factores ax²+bx+c irreducibles ⇒ (A₁x+B₁)/(a₁x²+b₁x+c₁) + … + (Aₙx+Bₙ)/(aₙx²+bₙx+cₙ)."],
["Cuadráticos repetidos","(ax²+bx+c)^n ⇒ (A₁x+B₁)/(ax²+bx+c) + (A₂x+B₂)/(ax²+bx+c)² + … + (Aₙx+Bₙ)/(ax²+bx+c)^n."]],
ex:[{t:"∫(2x+1)/(x^2+2x−3) dx",s:[["Factoriza (lineales distintos)","x^2+2x−3 = (x−1)(x+3)"],["Forma de la descomposición","(2x+1)/((x−1)(x+3)) = A/(x−1) + B/(x+3)"],["Multiplica por el denominador común","2x+1 = A(x+3) + B(x−1)"],["x=1 ⇒ 3=4A · x=−3 ⇒ −5=−4B","A = 3/4 ; B = 5/4"],["Integra cada término: ∫1/(x−k)dx = ln|x−k|","= ¾ ln|x−1| + 5/4 ln|x+3| + C"]]}]},
{n:"5 · Integral definida",th:[
["Definición (Riemann)","∫_{a}^{b}f(x)dx = lím_{|P|→0} Σ f(x*ₖ)Δxₖ. Partición regular: Δx=(b−a)/n, x*ₖ=a+k(b−a)/n ⇒ ∫_{a}^{b}f = lím_{n→∞} Σ_{k=1}^{n} f(a+k(b−a)/n)·(b−a)/n. Sumas útiles: Σ1=n, Σk=n(n+1)/2, Σk²=n(n+1)(2n+1)/6, Σk³=[n(n+1)/2]²."],
["Propiedades","i) ∫_{a}^{a}f=0. ii) ∫_{b}^{a}f = −∫_{a}^{b}f. iii) ∫kf = k∫f. iv) ∫(f±g)=∫f±∫g. v) Aditiva: ∫_{a}^{b}f=∫_{a}^{c}f+∫_{c}^{b}f. vi) Si f≥g entonces ∫f≥∫g. vii) Si m≤f≤M entonces m(b−a) ≤ ∫_{a}^{b}f ≤ M(b−a)."],
["Teorema Fundamental del Cálculo","<b>Antiderivada:</b> si F′=f en [a,b], ∫_{a}^{b}f(x)dx = F(b)−F(a) = F(x)|_{a}^{b}. <b>Derivada:</b> g(x)=∫_{a}^{x}f(t)dt es continua en [a,b], derivable en (a,b) y g′(x)=f(x), es decir d/dx ∫_{a}^{x}f(t)dt = f(x)."],
["Sustitución y partes definidas","Con u=g(x), c=g(a), d=g(b): ∫_{a}^{b}f(g(x))g′(x)dx = ∫_{c}^{d}f(u)du = F(d)−F(c) (cambia los límites). Partes: ∫_{a}^{b}f g′dx = f g|_{a}^{b} − ∫_{a}^{b}g f′dx."],
["Par e impar · Área total","f par en [−a,a]: ∫_{−a}^{a}f = 2∫_{0}^{a}f. f impar: ∫_{−a}^{a}f = 0. <b>Área total</b> entre f y el eje x: A = ∫_{a}^{b}|f(x)|dx (parte el intervalo donde f cambia de signo)."]],
ex:[
{t:"∫_{−2}^{1} x^3 dx",s:[["TFC: ∫_{a}^{b}f = F(b)−F(a). Antiderivada de x³","F(x) = x^4/4"],["Evalúa en los límites","= [x^4/4]_{−2}^{1} = 1/4 − (−2)^4/4"],["(−2)⁴ = 16","= 1/4 − 16/4 = −15/4"]]},
{t:"d/dx ∫_{1}^{x} √(t^2+1) dt",s:[["TFC (forma derivada): d/dx ∫_{a}^{x}f(t)dt = f(x)","= √(x^2+1)"]]},
{t:"∫_{0}^{3} |x−2| dx",s:[["|x−2| cambia en x=2: propiedad aditiva","= ∫_{0}^{2}(2−x)dx + ∫_{2}^{3}(x−2)dx"],["Integra cada parte","= [2x − x^2/2]_{0}^{2} + [x^2/2 − 2x]_{2}^{3}"],["Evalúa","= (4−2) + ((9/2−6) − (2−4))"],["Simplifica","= 2 + (−3/2 + 2) = 5/2"]]},
{t:"∫_{0}^{π/2} √cos x · sen x dx",s:[["Sustitución: u = cos x, du = −sen x dx","sen x dx = −du"],["Cambia los límites","x=0 ⇒ u=1 ; x=π/2 ⇒ u=0"],["Sustituye","= −∫_{1}^{0} u^{1/2}du"],["Invertir límites cambia el signo","= ∫_{0}^{1} u^{1/2}du"],["Evalúa con la potencia","= [⅔u^{3/2}]_{0}^{1} = 2/3"]]},
{t:"∫_{−3}^{3} x^3 √(4+x^2) dx",s:[["Revisa la paridad: calcula f(−x)","f(−x) = (−x)^3√(4+x^2) = −f(x)"],["f es impar e intervalo simétrico: ∫_{−a}^{a}f = 0","= 0"]]},
{t:"Área total de y=x^3 sobre [−2,1]",s:[["A = ∫|f|. x³<0 en [−2,0] y >0 en [0,1]","A = ∫_{−2}^{0}(−x^3)dx + ∫_{0}^{1}x^3dx"],["Integra","= [−x^4/4]_{−2}^{0} + [x^4/4]_{0}^{1}"],["Evalúa","= (0 + 16/4) + (1/4 − 0) = 17/4"]]}]}];
const TH=[[["La idea","Derivar: te dan f y buscas su derivada. Integrar es al revés: te dan f y buscas una F cuya derivada sea f. Ej.: si f = `2x`, F = `x^2`, porque al derivar `x^2` sale `2x`."],["Antiderivada y la + C","F es antiderivada de f si F′ = f. Hay muchas: `x^2`, `x^2 − 1`, `x^2 + 10` derivan todas en `2x`. Por eso siempre se escribe `+ C` (un número cualquiera)."],["¿Por qué solo cambia la C?","Si dos funciones tienen la misma derivada, su resta tiene derivada 0, y solo las constantes tienen derivada 0. Entonces G = F + C."],["Cómo se escribe","`∫ f(x) dx = F(x) + C`. f(x) es lo que integras, dx dice la variable, C es la constante. Integrar también se llama antiderivar."],["Reglas básicas","La constante sale: `∫3x dx = 3∫x dx`. Suma y resta: se integra término por término. Derivar e integrar se cancelan: la derivada de `∫f dx` es f."]],[["Cuándo usarla","Cuando en la integral ves una función y también su derivada (o casi). Ej.: en `∫cos^4x · sen x dx` está cos x y su derivada sen x."],["Los 4 pasos","1) Elige `u` = lo de adentro. 2) Calcula `du = u′ dx`. 3) Reescribe TODO con u y du, e integra. 4) Regresa u a x."],["Potencias","Caso muy común: `∫u^n du = u^{n+1}/(n+1) + C`."],["Completar el cuadrado","Con `x^2+6x+18`: suma y resta lo que falta para que quede `(x+3)^2 + 9`; luego `u = x+3`. Resultan: `∫1/(a^2+u^2) du = (1/a)·arctan(u/a)` y `∫1/√(a^2−u^2) du = arcsen(u/a)`."],["Tarea del profe","Deduce con identidades y sustitución: `∫tan x`, `∫cot x`, `∫sec x`, `∫csc x`."]],[["Fórmula","`∫u dv = u·v − ∫v du`. Sirve para integrar un producto de dos funciones."],["Cómo elegir","dv = lo que sabes integrar. u = lo que mejora al derivar (`ln x`, `arctan x`, `x`, `x^2`)."],["Pasos","1) Elige u y dv. 2) Calcula du (derivando u) y v (integrando dv). 3) Arma `u·v − ∫v du`. 4) Resuelve la integral nueva; a veces toca partes otra vez."],["Resultados de la clase","`∫ln x dx = x·ln x − x + C`. `∫x^2 cos x dx = x^2 sen x + 2x cos x − 2 sen x + C`. Tarea: `∫x^4 e^{−2x} dx` (partes 4 veces)."]],[["Idea","Partir una fracción grande en fracciones simples que sí sabes integrar. Ej.: `2/(x+5) + 1/(x+1) = (3x+7)/((x+1)(x+5))`; aquí haces el camino inverso. Requisito: el grado de arriba debe ser menor que el de abajo."],["Paso 1","Factoriza el denominador. Según el factor, la forma es:"],["Lineal distinto","`(x−1)(x+3)` → `A/(x−1) + B/(x+3)`"],["Lineal repetido","`(x+1)^3` → `A/(x+1) + B/(x+1)^2 + C/(x+1)^3`"],["Cuadrático (no se factoriza)","`x^2+9` → `(Ax+B)/(x^2+9)`. Repetido: `(Ax+B)/(x^2+9) + (Cx+D)/(x^2+9)^2`"],["Paso final","Multiplica todo por el denominador, halla A, B, C… (dando valores a x), e integra cada pedazo (salen `ln` o `arctan`)."]],[["Qué es","`∫_{a}^{b} f(x) dx` es el área con signo entre la gráfica y el eje x, de a hasta b. Arriba del eje suma, abajo resta."],["Con rectángulos (Riemann)","Divide [a, b] en n tiras de ancho `(b−a)/n`, suma (altura × ancho) y deja n → ∞. Sumas útiles: `1+…+n = n(n+1)/2`, `1^2+…+n^2 = n(n+1)(2n+1)/6`, `1^3+…+n^3 = [n(n+1)/2]^2`."],["Propiedades","`∫_{a}^{a} f = 0`. Invertir límites cambia el signo. Constantes salen; suma y resta se separan. Partir: `∫_{a}^{b} = ∫_{a}^{c} + ∫_{c}^{b}`. Si f ≥ g, entonces `∫f ≥ ∫g`. Si `m ≤ f ≤ M`: `m(b−a) ≤ ∫f ≤ M(b−a)`."],["Teorema Fundamental","Parte 1: `∫_{a}^{b} f dx = F(b) − F(a)`, con F antiderivada de f. Parte 2: la derivada de `∫_{a}^{x} f(t) dt` es `f(x)`."],["Sustitución y partes","Al cambiar a u, cambia también los límites: x = a → u = g(a), x = b → u = g(b). Partes: `∫_{a}^{b} u dv = [u·v]_{a}^{b} − ∫_{a}^{b} v du`."],["Par, impar y área total","Par: `∫_{−a}^{a} f = 2∫_{0}^{a} f`. Impar: `∫_{−a}^{a} f = 0`. Área total = `∫|f| dx`: parte donde f cambia de signo y suma las áreas como positivas."]]];T.forEach((t,i)=>t.th=TH[i]);

{t:"∫(x+3)/(x^4+9x^2) dx",s:[["Fracción propia (1 < 4). Factoriza: saca x² común","x^4+9x^2 = x^2(x^2+9)"],["x² es factor lineal repetido (x dos veces); x²+9 es cuadrático irreducible y lleva numerador Cx + D","(x+3)/(x^2(x^2+9)) = A/x + B/x^2 + (Cx+D)/(x^2+9)"],["Multiplica por x²(x²+9)","x+3 = Ax(x^2+9) + B(x^2+9) + (Cx+D)x^2"],["Desarrolla y agrupa por potencias de x","= (A + C)x^3 + (B + D)x^2 + 9A x + 9B"],["Término constante","3 = 9B ⇒ B = 1/3"],["Coeficiente de x","1 = 9A ⇒ A = 1/9"],["Coeficiente de x³ (izquierda 0)","0 = A + C ⇒ C = −1/9"],["Coeficiente de x² (izquierda 0)","0 = B + D ⇒ D = −1/3"],["Reescribe y separa","∫ = (1/9)∫dx/x + (1/3)∫x^{−2}dx − (1/9)∫x/(x^2+9)dx − (1/3)∫dx/(x^2+9)"],["∫1/x = ln|x| ; ∫x^{−2} = −1/x ; ∫x/(x²+9)dx con u = x²+9, du = 2x dx ⇒ ½ln(x²+9) ; ∫1/(x²+9) = (1/3)arctan(x/3)","= (1/9)ln|x| − 1/(3x) − (1/18)ln(x^2+9) − (1/9)arctan(x/3) + C"],["Junta logaritmos: (1/9)ln|x| = (1/18)ln x²","= (1/18)ln(x^2/(x^2+9)) − 1/(3x) − (1/9)arctan(x/3) + C ✓ (forma del profe)"]]})];

{t:"∫ln x dx",s:[["Fórmula de partes: ∫u dv = u·v − ∫v du. No se ve un producto: escribe ln x · 1 y toma dv = dx","∫ln x dx = ∫(ln x)(1) dx"],["Elige u = ln x (no sé integrarla, pero al derivarla se simplifica) y dv = dx","u = ln x ; dv = dx"],["Deriva u: d/dx ln x = 1/x","du = (1/x) dx"],["Integra dv (la constante se agrega al final)","v = ∫dx = x"],["Sustituye en u·v − ∫v du","= (ln x)(x) − ∫x·(1/x) dx"],["Simplifica: x·(1/x) = 1","= x ln x − ∫1 dx"],["∫1 dx = x ; agrega + C","= x ln x − x + C"],["Comprueba derivando (regla del producto): d/dx(x ln x) = ln x + x·(1/x)","d/dx[x ln x − x] = ln x + 1 − 1 = ln x ✓"]]},
{t:"∫x ln 2x dx",s:[["Producto de polinomio por logaritmo: u = ln 2x (se simplifica al derivar), dv = x dx","u = ln 2x ; dv = x dx"],["Deriva u con regla de la cadena: d/dx ln 2x = (1/2x)·2 = 1/x","du = (1/x) dx"],["Integra dv: ∫x dx = x²/2","v = x^2/2"],["Sustituye en u·v − ∫v du","∫x ln 2x dx = (ln 2x)(x^2/2) − ∫(x^2/2)(1/x) dx"],["Simplifica: (x²/2)(1/x) = x/2","= (x^2/2) ln 2x − ∫(x/2) dx"],["Saca ½ e integra ∫x dx = x²/2","= (x^2/2) ln 2x − ½·x^2/2 + C"],["Simplifica ½·½ = ¼","= (x^2/2) ln 2x − x^2/4 + C"],["Comprueba derivando (regla del producto en el primer término)","d/dx[…] = x ln 2x + (x^2/2)(1/x) − x/2 = x ln 2x + x/2 − x/2 ✓"]]},
{t:"∫x^{1/2} ln x dx",s:[["u = ln x (se simplifica al derivar), dv = x^{1/2} dx","u = ln x ; dv = x^{1/2} dx"],["Deriva u","du = (1/x) dx"],["Integra dv: 1/2 + 1 = 3/2, y dividir entre 3/2 es multiplicar por 2/3","v = x^{3/2}/(3/2) = (2/3) x^{3/2}"],["Sustituye en u·v − ∫v du","= (ln x)(2/3)x^{3/2} − ∫(2/3)x^{3/2}(1/x) dx"],["Simplifica exponentes: x^{3/2}/x = x^{3/2−1} = x^{1/2}, y saca 2/3","= (2/3)x^{3/2} ln x − (2/3)∫x^{1/2} dx"],["Integra ∫x^{1/2}dx = (2/3)x^{3/2}","= (2/3)x^{3/2} ln x − (2/3)(2/3)x^{3/2} + C"],["Simplifica (2/3)(2/3) = 4/9","= (2/3)x^{3/2} ln x − (4/9)x^{3/2} + C"],["Comprueba derivando: (4/9)(3/2) = 2/3","d/dx[…] = x^{1/2} ln x + (2/3)x^{1/2} − (2/3)x^{1/2} = x^{1/2} ln x ✓"]]},
{t:"∫(ln t)^2 dt",s:[["Escribe (ln t)²·1: u = (ln t)², dv = dt","u = (ln t)^2 ; dv = dt"],["Deriva u con regla de la cadena: 2(ln t)·(1/t)","du = 2 ln t · (1/t) dt"],["Integra dv","v = t"],["Sustituye en u·v − ∫v du","= (ln t)^2·t − ∫t·2 ln t·(1/t) dt"],["Simplifica: t·(1/t) = 1, y saca el 2","= t(ln t)^2 − 2∫ln t dt"],["Aparece ∫ln t dt: es el primer ejemplo (también por partes)","∫ln t dt = t ln t − t"],["Sustituye","= t(ln t)^2 − 2(t ln t − t) + C"],["Distribuye el −2","= t(ln t)^2 − 2t ln t + 2t + C"],["Comprueba derivando término a término","(ln t)^2 + 2 ln t − 2 ln t − 2 + 2 = (ln t)^2 ✓"]]}),

{t:"∫x√(x+3) dx",s:[["u = x (al derivar queda 1: baja de grado), dv = √(x+3) dx (esta sí la sé integrar)","u = x ; dv = (x+3)^{1/2} dx"],["Deriva u","du = dx"],["Integra dv con w = x+3, dw = dx: ∫w^{1/2}dw = (2/3)w^{3/2}","v = (2/3)(x+3)^{3/2}"],["Sustituye en u·v − ∫v du","= x·(2/3)(x+3)^{3/2} − ∫(2/3)(x+3)^{3/2} dx"],["Saca la constante 2/3","= (2/3)x(x+3)^{3/2} − (2/3)∫(x+3)^{3/2} dx"],["Potencia: 3/2 + 1 = 5/2, y dividir entre 5/2 es multiplicar por 2/5","= (2/3)x(x+3)^{3/2} − (2/3)(2/5)(x+3)^{5/2} + C"],["Simplifica (2/3)(2/5) = 4/15","= (2/3)x(x+3)^{3/2} − (4/15)(x+3)^{5/2} + C"],["Comprueba derivando (regla del producto): (4/15)(5/2) = 2/3","d/dx[…] = (2/3)(x+3)^{3/2} + x(x+3)^{1/2} − (2/3)(x+3)^{3/2} = x√(x+3) ✓"]]},
{t:"∫x^2 cos x dx",s:[["u = x² (baja de grado al derivar), dv = cos x dx","u = x^2 ; dv = cos x dx"],["Deriva u e integra dv","du = 2x dx ; v = sen x"],["1ª aplicación: u·v − ∫v du","= x^2 sen x − ∫sen x·2x dx = x^2 sen x − 2∫x sen x dx"],["Quedó otra integral por partes. 2ª vez: u = x, dv = sen x dx","u = x ; dv = sen x dx"],["du = dx ; v = ∫sen x dx = −cos x","du = dx ; v = −cos x"],["Aplica u·v − ∫v du","∫x sen x dx = x(−cos x) − ∫(−cos x) dx = −x cos x + ∫cos x dx"],["∫cos x dx = sen x","∫x sen x dx = −x cos x + sen x"],["Sustituye en la 1ª aplicación","= x^2 sen x − 2(−x cos x + sen x) + C"],["Distribuye el −2","= x^2 sen x + 2x cos x − 2 sen x + C"],["Comprueba derivando","2x sen x + x^2 cos x + 2cos x − 2x sen x − 2cos x = x^2 cos x ✓"]]},
{t:"∫x^4 e^{−2x} dx   (pendiente del profe)",s:[["Cada aplicación baja un grado a x^n. 1ª vez: u = x⁴, dv = e^{−2x}dx","u = x^4 ; dv = e^{−2x} dx"],["du = 4x³dx ; v: ∫e^{−2x}dx con w = −2x, dw = −2dx","du = 4x^3 dx ; v = −½ e^{−2x}"],["Aplica u·v − ∫v du (menos por menos da más)","∫x^4e^{−2x}dx = −½x^4e^{−2x} + 2∫x^3e^{−2x}dx"],["2ª vez: u = x³, du = 3x²dx (mismo v)","∫x^3e^{−2x}dx = −½x^3e^{−2x} + (3/2)∫x^2e^{−2x}dx"],["3ª vez: u = x², du = 2x dx","∫x^2e^{−2x}dx = −½x^2e^{−2x} + ∫x e^{−2x}dx"],["4ª vez: u = x, du = dx; queda ∫e^{−2x}dx = −½e^{−2x}","∫x e^{−2x}dx = −½x e^{−2x} + ½∫e^{−2x}dx = −½x e^{−2x} − ¼e^{−2x}"],["Sustituye hacia arriba en la 3ª","∫x^2e^{−2x}dx = −½x^2e^{−2x} − ½x e^{−2x} − ¼e^{−2x}"],["Sustituye en la 2ª: 3/2 multiplica cada término","∫x^3e^{−2x}dx = −½x^3e^{−2x} − ¾x^2e^{−2x} − ¾x e^{−2x} − ⅜e^{−2x}"],["Sustituye en la 1ª: 2 multiplica cada término","= −½x^4e^{−2x} − x^3e^{−2x} − (3/2)x^2e^{−2x} − (3/2)x e^{−2x} − ¾e^{−2x} + C"],["Factor común −e^{−2x}/4 (cada coeficiente × 4)","= −(e^{−2x}/4)(2x^4 + 4x^3 + 6x^2 + 6x + 3) + C"]]}),

{t:"∫x arctan x dx",s:[["u = arctan x (no sé integrarla, y al derivarla se vuelve racional), dv = x dx","u = arctan x ; dv = x dx"],["Deriva u (fórmula 11)","du = dx/(1+x^2)"],["Integra dv","v = x^2/2"],["Sustituye en u·v − ∫v du","= (arctan x)(x^2/2) − ∫(x^2/2)·1/(1+x^2) dx"],["Saca ½","= (x^2/2) arctan x − ½∫x^2/(1+x^2) dx"],["No hay fórmula directa. Truco de la pág. 9: suma y resta 1 en el numerador","x^2/(1+x^2) = ((1+x^2) − 1)/(1+x^2) = 1 − 1/(1+x^2)"],["Integra: ∫1 dx = x ; ∫1/(1+x²)dx = arctan x","∫x^2/(1+x^2) dx = x − arctan x"],["Sustituye","= (x^2/2) arctan x − ½(x − arctan x) + C"],["Distribuye el −½","= (x^2/2) arctan x − x/2 + ½ arctan x + C"],["Comprueba derivando: (x²/2)/(1+x²) + (1/2)/(1+x²) = 1/2","d/dx[…] = x arctan x + ½ − ½ = x arctan x ✓"]]},
{t:"∫sen(ln x) dx",s:[["Llama I a la integral. Escribe sen(ln x)·1: u = sen(ln x), dv = dx","I = ∫sen(ln x) dx ; u = sen(ln x) ; dv = dx"],["du con regla de la cadena: cos(ln x)·(1/x)","du = cos(ln x)(1/x) dx ; v = x"],["1ª aplicación: u·v − ∫v du","I = x sen(ln x) − ∫x·cos(ln x)(1/x) dx"],["Simplifica: x·(1/x) = 1","I = x sen(ln x) − ∫cos(ln x) dx"],["2ª vez en ∫cos(ln x)dx: u = cos(ln x), dv = dx","du = −sen(ln x)(1/x) dx ; v = x"],["Aplica u·v − ∫v du (menos por menos da más)","∫cos(ln x)dx = x cos(ln x) + ∫sen(ln x) dx"],["Reconoce: la última integral es I otra vez (integral circular)","∫cos(ln x)dx = x cos(ln x) + I"],["Sustituye en la 1ª aplicación","I = x sen(ln x) − [x cos(ln x) + I]"],["Quita el corchete (cambian los signos)","I = x sen(ln x) − x cos(ln x) − I"],["Suma I a ambos lados","2I = x sen(ln x) − x cos(ln x)"],["Divide entre 2 y agrega C","I = (x/2)[sen(ln x) − cos(ln x)] + C"],["Comprueba derivando (regla del producto)","½(sen − cos) + (x/2)(cos/x + sen/x) = sen(ln x) ✓"]]})];

{t:"Pág. 9 · ∫√x dx",s:[["Raíz como exponente: √x = x^{1/2}","∫√x dx = ∫x^{1/2} dx"],["Potencia con n = 1/2: n + 1 = 3/2","= x^{3/2}/(3/2) + C"],["Dividir entre 3/2 equivale a multiplicar por 2/3","= (2/3) x^{3/2} + C"],["Comprueba derivando: (2/3)(3/2) = 1","d/dx[(2/3)x^{3/2}] = x^{1/2} = √x ✓"]]},
{t:"Pág. 9 · ∫(6x^3 − 5)/x dx",s:[["Separa la fracción en dos: (a − b)/c = a/c − b/c","= ∫(6x^3/x − 5/x) dx"],["Simplifica el primero: x³/x = x^{3−1} = x²","= ∫(6x^2 − 5/x) dx"],["Separa en dos integrales y saca constantes","= 6∫x^2 dx − 5∫(1/x) dx"],["∫x² = x³/3 (potencia) ; ∫1/x = ln|x| (fórmula 3)","= 6·x^3/3 − 5 ln|x| + C"],["Simplifica 6/3 = 2","= 2x^3 − 5 ln|x| + C"],["Comprueba derivando","d/dx[…] = 6x^2 − 5/x = (6x^3 − 5)/x ✓"]]},
{t:"Pág. 9 · ∫x^2/(1+x^2) dx",s:[["Arriba y abajo tienen el mismo grado: no hay fórmula directa. Truco: suma y resta 1 en el numerador","x^2 = (1 + x^2) − 1"],["Sustituye en el numerador","∫x^2/(1+x^2) dx = ∫((1+x^2) − 1)/(1+x^2) dx"],["Separa la fracción en dos","= ∫[(1+x^2)/(1+x^2) − 1/(1+x^2)] dx"],["Simplifica el primero: (1+x²)/(1+x²) = 1","= ∫[1 − 1/(1+x^2)] dx"],["Separa: ∫1 dx = x ; ∫1/(1+x²)dx = arctan x (fórmula 11)","= x − arctan x + C"],["Comprueba derivando: 1 − 1/(1+x²) = ((1+x²) − 1)/(1+x²)","d/dx[…] = x^2/(1+x^2) ✓"]]},
{t:"Pág. 10 · Ej. 7 · ∫(1 − t^{−0.52}) dt",s:[["Separa en dos integrales (propiedad de la resta)","= ∫1 dt − ∫t^{−0.52} dt"],["∫1 dt = t. En la otra, potencia con n = −0.52: n + 1 = 0.48","= t − t^{0.48}/0.48 + C"],["1/0.48 = 100/48 = 25/12","= t − (25/12) t^{0.48} + C"],["Comprueba derivando: (25/12)(0.48) = 1","d/dt[…] = 1 − t^{−0.52} ✓"]]},
{t:"Pág. 10 · Ej. 8 · ∫10w√w dw",s:[["Reescribe √w = w^{1/2} y saca el 10","= 10∫w·w^{1/2} dw"],["Misma base: suma exponentes 1 + 1/2 = 3/2","= 10∫w^{3/2} dw"],["Potencia: 3/2 + 1 = 5/2","= 10·w^{5/2}/(5/2) + C"],["Dividir entre 5/2 equivale a multiplicar por 2/5","= 10·(2/5) w^{5/2} + C"],["10·2/5 = 20/5 = 4","= 4 w^{5/2} + C"],["Comprueba derivando: 4·(5/2) = 10","d/dw[4w^{5/2}] = 10w^{3/2} = 10w√w ✓"]]},
{t:"Pág. 10 · Ej. 10 · ∫(2√t − t − 9/t^2) dt",s:[["Reescribe con exponentes: √t = t^{1/2} ; 9/t² = 9t^{−2}","= ∫(2t^{1/2} − t − 9t^{−2}) dt"],["Separa en tres integrales y saca constantes","= 2∫t^{1/2}dt − ∫t dt − 9∫t^{−2}dt"],["Potencia: 1/2 → 3/2 ; 1 → 2 ; −2 → −1","= 2·t^{3/2}/(3/2) − t^2/2 − 9·t^{−1}/(−1) + C"],["Simplifica: 2 ÷ (3/2) = 4/3 ; −9 ÷ (−1) = +9","= (4/3)t^{3/2} − t^2/2 + 9t^{−1} + C"],["t^{−1} = 1/t","= (4/3)t^{3/2} − t^2/2 + 9/t + C"],["Comprueba derivando: (4/3)(3/2) = 2 y d/dt(9/t) = −9/t²","d/dt[…] = 2√t − t − 9/t^2 ✓"]]},
{t:"Pág. 10 · Ej. 11 · ∫√x (x^2 − 2) dx",s:[["Reescribe √x = x^{1/2}","= ∫x^{1/2}(x^2 − 2) dx"],["Distribuye","= ∫(x^{1/2}·x^2 − 2x^{1/2}) dx"],["Suma exponentes: 1/2 + 2 = 5/2","= ∫(x^{5/2} − 2x^{1/2}) dx"],["Separa y saca la constante","= ∫x^{5/2}dx − 2∫x^{1/2}dx"],["Potencia: 5/2+1 = 7/2 ; 1/2+1 = 3/2","= x^{7/2}/(7/2) − 2·x^{3/2}/(3/2) + C"],["Dividir entre 7/2 = ×2/7 ; 2 ÷ (3/2) = 2·2/3 = 4/3","= (2/7)x^{7/2} − (4/3)x^{3/2} + C"],["Comprueba derivando: (2/7)(7/2) = 1 y (4/3)(3/2) = 2","d/dx[…] = x^{5/2} − 2x^{1/2} ✓"]]},
{t:"Pág. 10 · Ej. 12 · ∫(5/∛(s^2) + 2/√(s^3)) ds",s:[["Raíces a exponentes: ∛(s²) = s^{2/3} ; √(s³) = s^{3/2}","= ∫(5/s^{2/3} + 2/s^{3/2}) ds"],["Pasa al numerador cambiando el signo del exponente: 1/s^n = s^{−n}","= ∫(5s^{−2/3} + 2s^{−3/2}) ds"],["Separa y saca constantes","= 5∫s^{−2/3}ds + 2∫s^{−3/2}ds"],["Potencia: −2/3+1 = 1/3 ; −3/2+1 = −1/2","= 5·s^{1/3}/(1/3) + 2·s^{−1/2}/(−1/2) + C"],["Dividir entre 1/3 = ×3 ; dividir entre −1/2 = ×(−2)","= 15 s^{1/3} − 4 s^{−1/2} + C"],["Regresa a radicales: s^{1/3} = ∛s ; s^{−1/2} = 1/√s","= 15∛s − 4/√s + C"],["Comprueba derivando: 15·(1/3) = 5 y −4·(−1/2) = 2","d/ds[…] = 5s^{−2/3} + 2s^{−3/2} ✓"]]});
